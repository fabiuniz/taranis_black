name: Deploy to Google Cloud Platform

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Motivo da execução manual (opcional)'
        required: false
        default: 'Execução manual'    

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: us-central1
  SERVICE_NAME: taranis-finance-ai
  IMAGE_NAME: taranis-finance-ai
  WORKING_DIR: taranis-finance-ai

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Grant execute permission for Maven Wrapper
      run: |
        if [ -f "${{ env.WORKING_DIR }}/mvnw" ]; then
          chmod +x ${{ env.WORKING_DIR }}/mvnw
        fi

    - name: Run tests
      working-directory: ${{ env.WORKING_DIR }}
      run: |
        if [ -f "./mvnw" ]; then
          ./mvnw clean test
        else
          mvn clean test
        fi

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Grant execute permission for Maven Wrapper
      run: |
        if [ -f "${{ env.WORKING_DIR }}/mvnw" ]; then
          chmod +x ${{ env.WORKING_DIR }}/mvnw
        fi

    - name: Build application
      working-directory: ${{ env.WORKING_DIR }}
      run: |
        if [ -f "./mvnw" ]; then
          ./mvnw clean package -DskipTests
        else
          mvn clean package -DskipTests
        fi

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Enable Google Cloud APIs
      run: |
        gcloud services enable artifactregistry.googleapis.com run.googleapis.com

    - name: Ensure Artifact Registry Repo Exists
      run: |
        if ! gcloud artifacts repositories describe $SERVICE_NAME --location=$GCP_REGION >/dev/null 2>&1; then
          gcloud artifacts repositories create $SERVICE_NAME \
            --repository-format=docker \
            --location=$GCP_REGION \
            --description="Docker repository for $SERVICE_NAME API"
        fi

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker to use gcloud as credential helper
      run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

    - name: Build Docker image
      working-directory: ${{ env.WORKING_DIR }}
      run: |
        docker build -t ${{ env.GCP_REGION }}-docker.pkg.dev/$PROJECT_ID/$IMAGE_NAME/$IMAGE_NAME:$GITHUB_SHA .
        docker tag ${{ env.GCP_REGION }}-docker.pkg.dev/$PROJECT_ID/$IMAGE_NAME/$IMAGE_NAME:$GITHUB_SHA ${{ env.GCP_REGION }}-docker.pkg.dev/$PROJECT_ID/$IMAGE_NAME/$IMAGE_NAME:latest

    - name: Push Docker image to Artifact Registry
      run: |
        docker push ${{ env.GCP_REGION }}-docker.pkg.dev/$PROJECT_ID/$IMAGE_NAME/$IMAGE_NAME:$GITHUB_SHA
        docker push ${{ env.GCP_REGION }}-docker.pkg.dev/$PROJECT_ID/$IMAGE_NAME/$IMAGE_NAME:latest

    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy $SERVICE_NAME \
          --image ${{ env.GCP_REGION }}-docker.pkg.dev/$PROJECT_ID/$IMAGE_NAME/$IMAGE_NAME:$GITHUB_SHA \
          --platform managed \
          --region $GCP_REGION \
          --allow-unauthenticated \
          --set-env-vars="GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}" \
          --memory=1Gi \
          --cpu=1 \
          --max-instances=10 \
          --timeout=300s

    - name: Get Cloud Run URL
      id: deploy
      run: |
        URL=$(gcloud run services describe $SERVICE_NAME --platform managed --region $GCP_REGION --format 'value(status.url)')
        echo "url=$URL" >> $GITHUB_OUTPUT
        echo "Service deployed at: $URL"