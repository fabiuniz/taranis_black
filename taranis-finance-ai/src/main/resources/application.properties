server.port=${PORT:8000}
spring.config.import=optional:file:.env[.properties]
google.api.key=${GOOGLE_API_KEY}
google.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}

# Tempo limite para requisições assíncronas do Spring MVC / Tomcat (120 segundos)
# Necessário pois a geração do relatório completo pela IA pode levar de 15 a 45 segundos
spring.mvc.async.request-timeout=120000
